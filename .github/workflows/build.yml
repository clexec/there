name: Build THERE Music

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme THEREMusic \
            -project THEREMusic.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for Simulator (verify compile)
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16 Pro" \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build_sim.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)" || true
          grep -q "BUILD FAILED" build_sim.txt && { grep "error:" build_sim.txt | head -40; exit 1; } || true

      - name: Archive & Build for Device
        run: |
          set -o pipefail
          xcodebuild archive \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$PWD/build/THEREMusic.xcarchive" \
            -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | tee build_archive.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)" || true
          grep -q "BUILD FAILED" build_archive.txt && { grep "error:" build_archive.txt | head -40; exit 1; } || true
          echo "Archive:"
          find build -name "*.app" 2>/dev/null | head -5

      - name: Package IPA from Simulator build
        run: |
          # Get .app from simulator build (DerivedData)
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "THEREMusic.app" \
            -path "*/Debug-iphonesimulator/*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "THEREMusic.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" 2>/dev/null | head -1)
          fi
          echo "Found: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/THEREMusic.app
            zip -r THEREMusic.ipa Payload/
            echo "IPA: $(du -sh THEREMusic.ipa)"
          else
            echo "No .app found — listing DerivedData:"
            ls ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: THEREMusic-IPA
          path: THEREMusic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_sim.txt
            build_archive.txt
          if-no-files-found: warn
