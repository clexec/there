name: Build THERE Music

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme THEREMusic \
            -project THEREMusic.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for Simulator (verify compile)
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build_output.txt | grep -E "error:|Build (FAILED|succeeded)" || true
          if grep -q "BUILD FAILED" build_output.txt; then
            grep "error:" build_output.txt | head -50
            exit 1
          fi

      - name: Archive for iOS device (IPA)
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcodebuild archive \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -sdk iphoneos \
            -archivePath build/THEREMusic.xcarchive \
            -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee archive_output.txt | grep -E "error:|BUILD|Archive" || true
          if grep -q "BUILD FAILED" archive_output.txt; then
            grep "error:" archive_output.txt | head -50
            exit 1
          fi
          ls -la build/ || true

      - name: Package IPA manually from .xcarchive
        run: |
          mkdir -p build/IPA/Payload
          APP_PATH=$(find build/THEREMusic.xcarchive/Products -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/IPA/Payload/
            cd build/IPA
            zip -r ../THEREMusic.ipa Payload/
            echo "IPA created successfully"
            ls -lh ../THEREMusic.ipa
          else
            echo "No .app found in archive"
            find build/THEREMusic.xcarchive -type d | head -20
          fi

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f build/THEREMusic.ipa ]; then
            cp build/THEREMusic.ipa artifacts/
            echo "✅ IPA ready: $(du -sh artifacts/THEREMusic.ipa)"
          fi
          if [ -d build/THEREMusic.xcarchive ]; then
            cd build && zip -r ../artifacts/THEREMusic-archive.zip THEREMusic.xcarchive && cd ..
            echo "✅ Archive zipped"
          fi
          ls -lh artifacts/ || echo "No artifacts"

      - name: Upload IPA + Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THEREMusic-IPA
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
