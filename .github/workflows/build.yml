name: Build THERE Music

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme THEREMusic \
            -project THEREMusic.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build_output.txt | grep -E "error:|warning:|note:|Build (FAILED|succeeded)" || true
          if grep -q "BUILD FAILED" build_output.txt; then
            echo "=== ERRORS ==="
            grep "error:" build_output.txt | head -50
            exit 1
          fi

      - name: Archive (for IPA)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "generic/platform=iOS" \
            -archivePath build/THEREMusic.xcarchive \
            -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            2>&1 | tee archive_output.txt | grep -E "error:|Build (FAILED|succeeded)" || true
          if grep -q "BUILD FAILED" archive_output.txt; then
            echo "=== ARCHIVE ERRORS ==="
            grep "error:" archive_output.txt | head -50
            exit 1
          fi

      - name: Export IPA (unsigned)
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/THEREMusic.xcarchive \
            -exportPath build/IPA \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 || echo "Export skipped — archive available as artifact"

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f build_output.txt ]; then cp build_output.txt artifacts/; fi
          if ls build/IPA/*.ipa 2>/dev/null; then cp build/IPA/*.ipa artifacts/; fi
          if [ -d build/THEREMusic.xcarchive ]; then
            cd build && zip -r ../artifacts/THEREMusic-archive.zip THEREMusic.xcarchive && cd ..
            echo "Archive zipped"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THEREMusic-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
