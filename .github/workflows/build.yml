name: Build THERE Music

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show available schemes & SDKs
        run: |
          echo "=== Schemes ==="
          xcodebuild -project THEREMusic.xcodeproj -list
          echo "=== SDKs ==="
          xcodebuild -showsdks | grep -i iphone

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme THEREMusic \
            -project THEREMusic.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for Simulator (verify)
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build_sim.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)" || true
          grep -q "BUILD FAILED" build_sim.txt && { grep "error:" build_sim.txt | head -30; exit 1; } || true

      - name: Archive (iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -sdk iphoneos \
            -archivePath "$PWD/build/THEREMusic.xcarchive" \
            -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH="/Applications" \
            2>&1 | tee build_archive.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)|Touching" || true
          grep -q "BUILD FAILED" build_archive.txt && { grep "error:" build_archive.txt | head -30; exit 1; } || true
          echo "Archive contents:"
          find build/THEREMusic.xcarchive -name "*.app" -maxdepth 6 2>/dev/null || echo "No .app found"

      - name: Package IPA from archive
        run: |
          APP=$(find "$PWD/build/THEREMusic.xcarchive" -name "*.app" -maxdepth 6 | head -1)
          echo "Found app: $APP"
          mkdir -p build/Payload
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            cp -r "$APP" build/Payload/
            cd build
            zip -r THEREMusic.ipa Payload/
            echo "✅ IPA size: $(du -sh THEREMusic.ipa)"
          else
            echo "No .app bundle found — archive may have failed silently"
            find build/ -type f | head -30
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: THEREMusic-IPA
          path: build/THEREMusic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_sim.txt
            build_archive.txt
          if-no-files-found: warn
