name: Build THERE Music

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme THEREMusic \
            -project THEREMusic.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for Simulator (verify compile)
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -sdk iphonesimulator \
            -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build_sim.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)" || true
          grep -q "BUILD FAILED" build_sim.txt && { grep "error:" build_sim.txt | head -40; exit 1; } || true

      - name: Build for iOS device (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project THEREMusic.xcodeproj \
            -scheme THEREMusic \
            -sdk iphoneos \
            -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_output" \
            2>&1 | tee build_device.txt | grep -E "error:|BUILD (FAILED|SUCCEEDED)" || true
          grep -q "BUILD FAILED" build_device.txt && { grep "error:" build_device.txt | head -40; exit 1; } || true
          echo "Build output:"
          find build_output -name "*.app" 2>/dev/null | head -5

      - name: Package IPA
        run: |
          APP=$(find build_output -name "*.app" -maxdepth 3 | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "THEREMusic.app" \
              -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
            echo "DerivedData App: $APP"
          fi
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r THEREMusic.ipa Payload/
            echo "IPA: $(du -sh THEREMusic.ipa)"
          else
            echo "No .app found"
            find ~/Library/Developer/Xcode/DerivedData -name "THEREMusic.app" 2>/dev/null | head -10
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: THEREMusic-IPA
          path: THEREMusic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_sim.txt
            build_device.txt
          if-no-files-found: warn
