name: THEREMusic
options:
  bundleIdPrefix: com.there
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.there.music
    PRODUCT_NAME: THERE Music
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    INFOPLIST_FILE: THEREMusic/Resources/Info.plist
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  LiquidGlassKit:
    url: https://github.com/DnV1eX/LiquidGlassKit.git
    from: "1.0.0"

targets:
  THEREMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: THEREMusic
        excludes:
          - "**/.DS_Store"
    resources:
      - THEREMusic/Resources
    info:
      path: THEREMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: THERE Music
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Required for voice comments
        NSCameraUsageDescription: Required for profile photo
        NSPhotoLibraryUsageDescription: Required for profile photo
        UIBackgroundModes:
          - audio
          - fetch
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.YOUR_GOOGLE_CLIENT_ID
              - theremusic
        GIDClientID: YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            itunes.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: false
            ws.audioscrobbler.com:
              NSExceptionAllowsInsecureHTTPLoads: false
    entitlements:
      path: THEREMusic/THEREMusic.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups: []
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.there.music
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
